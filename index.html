    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 2.5D Button Styles */
        .btn-3d {
            transition: all 0.1s;
            position: relative;
            top: 0;
        }
        .btn-3d:active {
            top: 4px;
            box-shadow: 0 0px 0 0 transparent !important;
        }
        
        .btn-blue { background-color: #3b82f6; color: white; box-shadow: 0 6px 0 0 #1d4ed8; }
        .btn-green { background-color: #22c55e; color: white; box-shadow: 0 6px 0 0 #15803d; }
        .btn-yellow { background-color: #eab308; color: white; box-shadow: 0 6px 0 0 #a16207; }
        .btn-orange { background-color: #f97316; color: white; box-shadow: 0 6px 0 0 #c2410c; }
        .btn-purple { background-color: #a855f7; color: white; box-shadow: 0 6px 0 0 #7e22ce; }
        .btn-gray { background-color: #94a3b8; color: white; box-shadow: 0 6px 0 0 #475569; }

        .math-input {
            width: 60px;
            text-align: center;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            background-color: #fef08a;
            color: #1e3a8a;
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
            user-select: auto;
        }
        .math-input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.3); }
        .math-input.correct { border-color: #22c55e; background-color: #bbf7d0; color: #166534; pointer-events: none;}
        .math-input.wrong { border-color: #ef4444; background-color: #fecaca; color: #991b1b; animation: shake 0.5s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .card-25d {
            background: white;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 8px 0 0 #cbd5e1;
        }

        .drag-item {
            cursor: grab;
            transition: transform 0.2s;
        }
        .drag-item:active { cursor: grabbing; transform: scale(0.95); }
        .selected-drag { border: 2px dashed #f97316; background-color: #ffedd5; }
        
        .slot {
            min-height: 48px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .slot:hover { border-color: #3b82f6; background-color: #eff6ff; }
        .slot.filled { border-style: solid; border-color: #3b82f6; background-color: white; }
        .slot.correct { border-color: #22c55e; background-color: #f0fdf4; pointer-events: none;}
        .slot.wrong { border-color: #ef4444; background-color: #fef2f2; animation: shake 0.5s; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

            { id: 12, q: "Cho hình bình hành ABCD, biết AB = 3cm, BC = 2cm. Chu vi của hình bình hành ABCD là:", options: ["6 cm", "10 cm", "12 cm", "5 cm"], ans: 1, exp: "Chu vi hình bình hành = 2 × (AB + BC) = 2 × (3 + 2) = 10 (cm)." },

            },
            {
                id: '4.2', name: 'Bài 3.2: Trồng cây',
                context: 'Vườn hình chữ nhật dài 24m, rộng 18m. Cứ 3m trồng một cây dọc đường bao khu vườn (kể cả góc). Mỗi cây giống 18.000đ, công trồng cây là 240.000đ.',
                drags: ['(24 + 18) × 2', '84 : 3', '28 × 18000', '504000 + 240000', '24 × 18', '28 × 18000 + 240000'],
                steps: [
                    { label: 'Chu vi khu vườn:', dragAns: '(24 + 18) × 2', inputAns: '84' },
                    { label: 'Số cây cần trồng (vòng khép kín):', dragAns: '84 : 3', inputAns: '28' },
                    { label: 'Tiền mua cây giống:', dragAns: '28 × 18000', inputAns: '504000' },
                    { label: 'Tổng chi phí (Cây + Công):', dragAns: '504000 + 240000', inputAns: '744000' }
                ],
                unit: '',
                hints: ["Chu vi = (Dài + Rộng) × 2.", "Vì trồng khép kín nên Số cây = Chu vi : Khoảng cách.", "Tính tiền mua cây.", "Cộng thêm tiền công trồng."]
            },
            {
                id: '4.3', name: 'Bài 3.3: Lát gạch',
                context: 'Sân nhà hình chữ nhật dài 15m, rộng 4m. Lát bằng gạch hình vuông cạnh 40cm. Hỏi cần bao nhiêu viên gạch? (Biết không hao hụt)',
                drags: ['15 × 4', '40 cm = 0,4 m', '0,4 × 0,4', '60 : 0,16', '(15+4)×2', '60 × 0,16'],
                steps: [
                    { label: 'Diện tích sân:', dragAns: '15 × 4', inputAns: '60' },
                    { label: 'Đổi đơn vị:', dragAns: '40 cm = 0,4 m', inputAns: '0,4' },
                    { label: 'Diện tích 1 viên gạch:', dragAns: '0,4 × 0,4', inputAns: '0,16' },
                    { label: 'Số viên gạch cần dùng:', dragAns: '60 : 0,16', inputAns: '375' }
                ],
                unit: '',
                hints: ["Tính diện tích sân = Dài × Rộng.", "Đổi 40cm ra mét.", "Tính diện tích 1 viên gạch.", "Lấy Diện tích sân chia cho Diện tích 1 viên gạch."]
            },
            {
                id: '4.4', name: 'Bài 3.4: Vệ sinh sân',
                context: 'Sân trường chữ nhật dài 30m, rộng 18m. Bên trong có bồn hoa vuông cạnh 6m không quét. Mỗi học sinh quét 36m². Cần bao nhiêu học sinh?',
                drags: ['30 × 18', '6 × 6', '540 − 36', '504 : 36', '30 + 18', '540 + 36'],
                steps: [
                    { label: 'Diện tích toàn bộ sân:', dragAns: '30 × 18', inputAns: '540' },
                    { label: 'Diện tích bồn hoa:', dragAns: '6 × 6', inputAns: '36' },
                    { label: 'Diện tích cần quét:', dragAns: '540 − 36', inputAns: '504' },
                    { label: 'Số học sinh cần ít nhất:', dragAns: '504 : 36', inputAns: '14' }
                ],
                unit: '',
                hints: ["Tính diện tích cả sân trường.", "Tính diện tích bồn hoa.", "Lấy diện tích sân trừ đi bồn hoa.", "Chia diện tích cần quét cho 36m²."]
            }
        ];


        // --- COMPONENTS ---

        // Component Thông báo / Modal chung
        const Modal = ({ isOpen, onClose, title, content, type = 'info' }) => {
            if (!isOpen) return null;
            const colors = {
                success: 'bg-green-100 text-green-800 border-green-400',
                error: 'bg-red-100 text-red-800 border-red-400',
                info: 'bg-blue-100 text-blue-800 border-blue-400'
            };
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className={`bg-white rounded-2xl shadow-xl w-full max-w-md border-t-8 ${type === 'success' ? 'border-green-500' : type === 'error' ? 'border-red-500' : 'border-blue-500'} overflow-hidden transform transition-all`}>
                        <div className="p-6">
                            <h3 className="text-2xl font-bold mb-2 flex items-center gap-2">
                                {type === 'success' && <i className="fa-solid fa-check-circle text-green-500"></i>}
                                {type === 'error' && <i className="fa-solid fa-triangle-exclamation text-red-500"></i>}
                                {type === 'info' && <i className="fa-solid fa-lightbulb text-yellow-500"></i>}
                                {title}
                            </h3>
                            <p className="text-gray-700 text-lg">{content}</p>
                        </div>
                        <div className="bg-gray-50 px-6 py-4 flex justify-end">
                            <button onClick={onClose} className="btn-3d btn-blue px-6 py-2 rounded-xl font-bold">Đóng</button>
                        </div>
                    </div>
                </div>
            );
        };

        // CHẶNG 1
        const Stage1 = ({ onComplete, studentName, studentClass }) => {
            const [questions, setQuestions] = useState([]);
            const [currentQ, setCurrentQ] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showAns, setShowAns] = useState(false);
            const [score, setScore] = useState(0);
            const [wrongQs, setWrongQs] = useState([]);
            const [isDone, setIsDone] = useState(false);
            
            // State cho thời gian và gửi dữ liệu Google Sheets
            const startTime = useRef(Date.now());
            const [timeString, setTimeString] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null);

            useEffect(() => {
                // Trộn ngẫu nhiên thứ tự câu hỏi khi bắt đầu
                const shuffled = [...stage1Data].sort(() => Math.random() - 0.5);
                setQuestions(shuffled);
            }, []);

            const handleCheck = () => {
                if (selected === null) return;
                setShowAns(true);
                if (selected === questions[currentQ].ans) {
                    setScore(s => s + 1);
                } else {
                    if (!wrongQs.includes(questions[currentQ].id)) setWrongQs([...wrongQs, questions[currentQ].id]);
                }
            };

            const handleNext = () => {
                if (currentQ < questions.length - 1) {
                    setCurrentQ(q => q + 1);
                    setSelected(null);
                    setShowAns(false);
                } else {
                    // Tính thời gian hoàn thành
                    const timeElapsed = Math.floor((Date.now() - startTime.current) / 1000);
                    const mins = Math.floor(timeElapsed / 60);
                    const secs = timeElapsed % 60;
                    setTimeString(`${mins} phút ${secs} giây`);
                    
                    setIsDone(true);
                }
            };

            const submitToGoogleSheets = async () => {
                setIsSubmitting(true);
                setSubmitStatus(null);
                
                const payload = {
                    hoTen: studentName,
                    lop: studentClass,
                    diem: ((score / questions.length) * 10).toFixed(1), // Tính điểm hệ 10
                    cauDung: score,
                    cauSai: wrongQs.length,
                    cauChuaLam: questions.length - score - wrongQs.length,
                    tongSoCau: questions.length,
                    thoiGian: timeString
                };

                try {
                    const response = await fetch("https://script.google.com/macros/s/AKfycbzm-NDTI1VGpuumxjVd0QqsKN8-8eNtdnPbSyGmlAetaUjKI8GxIrBJcEncJKhw4R7tDg/exec", {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        setSubmitStatus({ type: 'success', message: 'Đã lưu kết quả lên hệ thống thành công!' });
                    } else {
                        setSubmitStatus({ type: 'error', message: 'Lỗi: ' + result.message });
                    }
                } catch (error) {
                    console.error("Lỗi:", error);
                    setSubmitStatus({ type: 'error', message: 'Lỗi kết nối. Vui lòng kiểm tra lại mạng hoặc báo giáo viên.' });
                }
                setIsSubmitting(false);
            };

            const resetStage = () => {
                setIsDone(false); 
                setCurrentQ(0); 
                setScore(0); 
                setWrongQs([]); 
                setSelected(null); 
                setShowAns(false);
                setSubmitStatus(null);
                startTime.current = Date.now(); // Reset bộ đếm thời gian
                setQuestions([...stage1Data].sort(() => Math.random() - 0.5));
            };

            if (questions.length === 0) return null;

            if (isDone) {
                return (
                    <div className="flex flex-col items-center justify-center p-8 bg-white rounded-3xl shadow-lg border-2 border-blue-100 text-center animate-fade-in">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Pi&backgroundColor=b6e3f4" alt="Robot Pi" className="w-32 h-32 mb-4 rounded-full border-4 border-blue-200" />
                        <h2 className="text-3xl font-bold text-blue-600 mb-4">Hoàn thành Chặng 1!</h2>
                        
                        {/* Khu vực Hiển thị Thông số chi tiết */}
                        <div className="grid grid-cols-2 gap-4 w-full max-w-md mb-6 text-left">
                            <div className="bg-gray-50 p-4 rounded-xl border">
                                <p className="text-gray-500 font-bold text-sm">Điểm số (Hệ 10)</p>
                                <p className="text-2xl font-black text-blue-600">{((score / questions.length) * 10).toFixed(1)} / 10</p>
                            </div>
                            <div className="bg-gray-50 p-4 rounded-xl border">
                                <p className="text-gray-500 font-bold text-sm">Thời gian làm</p>
                                <p className="text-lg font-bold text-gray-800">{timeString}</p>
                            </div>
                            <div className="bg-green-50 p-4 rounded-xl border border-green-200">
                                <p className="text-green-600 font-bold text-sm">Số câu đúng</p>
                                <p className="text-2xl font-black text-green-700">{score}</p>
                            </div>
                            <div className="bg-red-50 p-4 rounded-xl border border-red-200">
                                <p className="text-red-500 font-bold text-sm">Số câu sai</p>
                                <p className="text-2xl font-black text-red-600">{wrongQs.length}</p>
                            </div>
                        </div>

                        {wrongQs.length > 0 && (
                            <div className="mb-6 p-4 bg-orange-50 rounded-xl border border-orange-200 w-full max-w-md">
                                <p className="font-bold text-orange-600 mb-2">Mã các câu cần luyện lại:</p>
                                <div className="flex flex-wrap gap-2 justify-center">
                                    {wrongQs.map(qId => <span key={qId} className="px-3 py-1 bg-white rounded-md shadow-sm text-orange-700">Câu {qId}</span>)}
                                </div>
                            </div>
                        )}

                        {submitStatus && (
                            <div className={`mb-6 p-4 rounded-xl w-full max-w-md font-bold ${submitStatus.type === 'success' ? 'bg-green-100 text-green-800 border-2 border-green-300' : 'bg-red-100 text-red-800 border-2 border-red-300'}`}>
                                {submitStatus.message}
                            </div>
                        )}

                        <div className="flex flex-col sm:flex-row gap-4">
                            <button onClick={resetStage} className="btn-3d btn-orange px-6 py-3 rounded-full font-bold text-lg">Làm Lại</button>
                            
                            <button 
                                onClick={submitToGoogleSheets} 
                                disabled={isSubmitting || (submitStatus && submitStatus.type === 'success')} 
                                className={`btn-3d px-6 py-3 rounded-full font-bold text-lg text-white ${isSubmitting || (submitStatus && submitStatus.type === 'success') ? 'bg-gray-400 cursor-not-allowed shadow-none top-[4px]' : 'btn-blue'}`}
                            >
                                {isSubmitting ? 'Đang gửi...' : 'Gửi Kết Quả'} <i className="fa-solid fa-cloud-arrow-up ml-1"></i>
                            </button>

                            <button onClick={() => onComplete()} className="btn-3d btn-green px-6 py-3 rounded-full font-bold text-lg">Trở Về <i className="fa-solid fa-house ml-1"></i></button>
                        </div>
                    </div>
                );
            }

            const q = questions[currentQ];
            return (
                <div className="max-w-3xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                        <div className="text-lg font-bold text-gray-500">Tiến độ: {currentQ + 1} / {questions.length}</div>
                        <div className="h-4 w-1/2 bg-gray-200 rounded-full overflow-hidden">
                            <div className="h-full bg-blue-500 transition-all" style={{width: `${((currentQ)/questions.length)*100}%`}}></div>
                        </div>
                    </div>
                    
                    <div className="card-25d p-6 md:p-8 mb-8">
                        <h3 className="text-2xl font-bold text-gray-800 mb-6">{q.q}</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {q.options.map((opt, i) => (
                                <button 
                                    key={i}
                                    disabled={showAns}
                                    onClick={() => setSelected(i)}
                                    className={`p-4 rounded-xl text-left font-semibold border-2 transition-all ${
                                        showAns 
                                            ? i === q.ans 
                                                ? 'bg-green-100 border-green-500 text-green-800' 
                                                : i === selected ? 'bg-red-100 border-red-500 text-red-800' : 'bg-gray-50 border-gray-200 opacity-50'
                                            : selected === i 
                                                ? 'bg-blue-100 border-blue-500 text-blue-800 shadow-md' 
                                                : 'bg-white border-gray-300 hover:border-blue-300 hover:bg-blue-50'
                                    }`}
                                >
                                    <span className="inline-block w-8 h-8 rounded-full bg-white text-center leading-8 border mr-3 shadow-sm">{String.fromCharCode(65+i)}</span>
                                    {opt}
                                </button>
                            ))}
                        </div>
                        
                        {showAns && (
                            <div className={`mt-6 p-4 rounded-xl flex items-start gap-4 ${selected === q.ans ? 'bg-green-50 text-green-800' : 'bg-orange-50 text-orange-800'}`}>
                                <i className={`fa-solid mt-1 text-2xl ${selected === q.ans ? 'fa-face-smile text-green-500' : 'fa-face-frown text-orange-500'}`}></i>
                                <div>
                                    <p className="font-bold">{selected === q.ans ? 'Tuyệt vời!' : 'Chưa chính xác rồi!'}</p>
                                    <p>{q.exp}</p>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="flex justify-end">
                        {!showAns ? (
                            <button onClick={handleCheck} disabled={selected === null} className={`btn-3d px-8 py-3 rounded-full font-bold text-xl ${selected !== null ? 'btn-blue' : 'btn-gray opacity-50 cursor-not-allowed'}`}>Kiểm Tra</button>
                        ) : (
                            <button onClick={handleNext} className="btn-3d btn-green px-8 py-3 rounded-full font-bold text-xl">Câu Tiếp Theo <i className="fa-solid fa-arrow-right ml-2"></i></button>
                        )}
                    </div>
                </div>
            );
        };

        // CHẶNG 2
        const Stage2 = ({ onComplete }) => {
            const [currentBài, setCurrentBài] = useState(0);
            const [inputValues, setInputValues] = useState({});
            const [lineStatus, setLineStatus] = useState({}); // 'locked', 'active', 'correct'
            const [hintLevel, setHintLevel] = useState(0);
            const [modal, setModal] = useState({ open: false, title: '', content: '', type: 'info' });
            
            const bài = stage2Data[currentBài];

            // Initialize lines
            useEffect(() => {
                const initialStatus = {};
                bài.lines.forEach((l, idx) => {
                    initialStatus[idx] = idx === 1 ? 'active' : (idx === 0 ? 'correct' : 'locked');
                });
                setLineStatus(initialStatus);
                setInputValues({});
                setHintLevel(0);
            }, [currentBài]);

            const handleInputChange = (lineIdx, inputIdx, val) => {
                const cleanVal = val.replace(/\s/g, ''); // Remove spaces
                setInputValues(prev => ({...prev, [`${lineIdx}_${inputIdx}`]: cleanVal}));
            };

            const checkLine = (lineIdx) => {
                const line = bài.lines[lineIdx];
                let allCorrect = true;
                
                line.inputs.forEach((inp, idx) => {
                    const userVal = inputValues[`${lineIdx}_${idx}`] || '';
                    if (userVal !== inp.ans) allCorrect = false;
                });

                if (allCorrect) {
                    setLineStatus(prev => ({...prev, [lineIdx]: 'correct', [lineIdx + 1]: lineIdx + 1 < bài.lines.length ? 'active' : 'locked'}));
                    setHintLevel(0);
                    // Check if complete
                    if (lineIdx === bài.lines.length - 1) {
                        setModal({ open: true, title: 'Tuyệt Vời!', content: 'Em đã thực hiện chính xác các bước giải!', type: 'success' });
                    }
                } else {
                    setHintLevel(h => Math.min(h + 1, 3));
                    const currentHint = bài.hints[lineIdx - 1] || "Hãy tính toán lại cẩn thận nhé!";
                    setModal({ 
                        open: true, 
                        title: 'Chưa chính xác', 
                        content: hintLevel === 0 ? "Em hãy kiểm tra lại phép tính ở bước này." : currentHint, 
                        type: 'error' 
                    });
                    
                    // Mark wrong fields for shake animation
                    const newInputs = {...inputValues};
                    line.inputs.forEach((inp, idx) => {
                        const key = `${lineIdx}_${idx}`;
                        if (newInputs[key] !== inp.ans) {
                            // trigger react re-render for animation class
                            setInputValues(prev => ({...prev, [key]: prev[key] + ' '})); 
                            setTimeout(() => {
                                setInputValues(prev => ({...prev, [key]: prev[key].trim()}));
                            }, 500);
                        }
                    });
                }
            };

            const nextBài = () => {
                if (currentBài < stage2Data.length - 1) {
                    setCurrentBài(c => c + 1);
                } else {
                    onComplete();
                }
            };

            return (
                <div className="max-w-3xl mx-auto">
                    <Modal isOpen={modal.open} onClose={() => setModal({...modal, open: false})} title={modal.title} content={modal.content} type={modal.type} />
                    
                    <div className="flex justify-between mb-4">
                        <h2 className="text-2xl font-bold text-blue-700">Chặng 2: {bài.name}</h2>
                        <div className="text-gray-500 font-bold">{currentBài + 1} / {stage2Data.length}</div>
                    </div>

                    <div className="card-25d p-6 md:p-10 mb-8 bg-white text-xl font-mono leading-loose">
                        {bài.lines.map((line, lIdx) => (
                            <div key={lIdx} className={`mb-4 flex items-center flex-wrap transition-opacity duration-500 ${lineStatus[lIdx] === 'locked' ? 'opacity-30 pointer-events-none' : 'opacity-100'}`}>
                                {line.type === 'text' ? (
                                    <div className="font-bold text-2xl w-full text-blue-900 border-b-2 border-blue-100 pb-2">{line.text}</div>
                                ) : (
                                    <div className="flex items-center flex-wrap gap-y-2">
                                        <span>{line.text1}</span>
                                        {line.inputs.map((inp, iIdx) => {
                                            const val = inputValues[`${lIdx}_${iIdx}`] || '';
                                            const isCorrect = val === inp.ans && lineStatus[lIdx] === 'correct';
                                            return (
                                                <React.Fragment key={iIdx}>
                                                    {inp.pre && <span>{inp.pre}</span>}
                                                    <input 
                                                        type="text" 
                                                        value={val}
                                                        onChange={(e) => handleInputChange(lIdx, iIdx, e.target.value)}
                                                        disabled={lineStatus[lIdx] !== 'active'}
                                                        className={`math-input mx-1 text-xl py-1 ${isCorrect ? 'correct' : ''}`}
                                                        style={{ width: `${Math.max(60, (val.length + 1) * 15)}px` }}
                                                    />
                                                </React.Fragment>
                                            );
                                        })}
                                        {line.text2 && <span>{line.text2}</span>}
                                        
                                        {lineStatus[lIdx] === 'active' && (
                                            <button onClick={() => checkLine(lIdx)} className="ml-4 bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded-lg text-sm font-bold shadow-sm">
                                                Kiểm tra dòng này <i className="fa-solid fa-check ml-1"></i>
                                            </button>
                                        )}
                                        {lineStatus[lIdx] === 'correct' && (
                                            <i className="fa-solid fa-check-circle text-green-500 ml-4 text-2xl"></i>
                                        )}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    <div className="flex justify-between items-center">
                        <button onClick={() => setModal({open:true, title: 'Gợi ý', content: bài.hints[0] || 'Cố gắng lên!', type: 'info'})} className="btn-3d btn-yellow px-6 py-2 rounded-xl font-bold">
                            <i className="fa-solid fa-lightbulb mr-2"></i> Gợi ý
                        </button>
                        
                        {lineStatus[bài.lines.length - 1] === 'correct' && (
                            <button onClick={nextBài} className="btn-3d btn-green px-8 py-3 rounded-full font-bold text-xl">
                                Bài Tiếp Theo <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // CHẶNG 3 & 4 CƠ CHẾ KÉO THẢ (Click để chọn & đổi chỗ cho thân thiện mobile)
        
        const Stage3 = ({ onComplete }) => {
            const [currentBài, setCurrentBài] = useState(0);
            const [blocks, setBlocks] = useState([]);
            const [slots, setSlots] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [modal, setModal] = useState({open:false});
            const [isCorrect, setIsCorrect] = useState(false);

            const bài = stage3Data[currentBài];

            useEffect(() => {
                // Initialize Shuffle
                const shuffled = [...bài.blocks].sort(() => Math.random() - 0.5);
                setBlocks(shuffled.map((t, i) => ({ id: `b_${i}`, text: t })));
                setSlots(Array(bài.correctOrder.length).fill(null));
                setSelectedId(null);
                setIsCorrect(false);
            }, [currentBài]);

            const handleBlockClick = (id, fromType, idx) => {
                if (isCorrect) return;

                if (!selectedId) {
                    setSelectedId({ id, type: fromType, index: idx });
                } else {
                    // Swap logic
                    const newBlocks = [...blocks];
                    const newSlots = [...slots];
                    
                    const src = selectedId;
                    const dest = { id, type: fromType, index: idx };

                    let srcItem, destItem;

                    if (src.type === 'pool') srcItem = newBlocks[src.index];
                    else srcItem = newSlots[src.index];

                    if (dest.type === 'pool') destItem = newBlocks[dest.index];
                    else destItem = newSlots[dest.index];

                    // Swap
                    if (src.type === 'pool') newBlocks[src.index] = destItem;
                    else newSlots[src.index] = destItem;

                    if (dest.type === 'pool') newBlocks[dest.index] = srcItem;
                    else newSlots[dest.index] = srcItem;

                    setBlocks(newBlocks);
                    setSlots(newSlots);
                    setSelectedId(null);
                }
            };

            const checkAnswer = () => {
                let allCorrect = true;
                if (slots.includes(null)) {
                    setModal({open:true, title:'Chưa hoàn thành', content:'Em hãy kéo (hoặc bấm chọn) đủ các thẻ vào ô trống nhé.', type:'error'});
                    return;
                }

                slots.forEach((s, i) => {
                    if (s.text !== bài.correctOrder[i]) allCorrect = false;
                });

                if (allCorrect) {
                    setIsCorrect(true);
                    setModal({open:true, title:'Tuyệt vời', content:'Em đã sắp xếp đúng các bước giải!', type:'success'});
                } else {
                    setModal({open:true, title:'Sai rồi', content:'Thứ tự chưa đúng. Em hãy xem lại gợi ý: ' + bài.hints[0], type:'error'});
                }
            };

            return (
                <div className="max-w-4xl mx-auto">
                    <Modal isOpen={modal.open} onClose={() => setModal({...modal, open: false})} title={modal.title} content={modal.content} type={modal.type} />
                    
                    <div className="flex justify-between mb-4">
                        <h2 className="text-2xl font-bold text-purple-700">Chặng 3: Tìm X - {bài.name}</h2>
                        <div className="text-gray-500 font-bold">{currentBài + 1} / {stage3Data.length}</div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-8">
                        {/* Khu vực đề bài & Lắp ráp */}
                        <div className="card-25d p-6">
                            <h3 className="text-2xl font-bold text-center text-blue-900 mb-6 bg-blue-50 py-3 rounded-xl border border-blue-200">{bài.question}</h3>
                            
                            <div className="space-y-3">
                                {slots.map((slot, i) => (
                                    <div 
                                        key={`s_${i}`}
                                        onClick={() => handleBlockClick(slot ? slot.id : null, 'slot', i)}
                                        className={`slot ${slot ? 'filled' : ''} ${isCorrect ? 'correct' : ''} ${selectedId && selectedId.type === 'slot' && selectedId.index === i ? 'selected-drag' : ''}`}
                                    >
                                        {slot ? <span className="font-mono text-xl font-bold text-gray-800">{slot.text}</span> : <span className="text-gray-400">Bước {i+1}</span>}
                                    </div>
                                ))}
                            </div>

                            <div className="mt-8 flex justify-center">
                                {!isCorrect ? (
                                    <button onClick={checkAnswer} className="btn-3d btn-blue px-8 py-3 rounded-full font-bold text-xl">Kiểm tra kết quả</button>
                                ) : (
                                    <button onClick={() => { if(currentBài < stage3Data.length-1) setCurrentBài(c=>c+1); else onComplete(); }} className="btn-3d btn-green px-8 py-3 rounded-full font-bold text-xl">Câu Tiếp Theo <i className="fa-solid fa-arrow-right"></i></button>
                                )}
                            </div>
                        </div>

                        {/* Khu vực thẻ kho */}
                        <div className="card-25d p-6 bg-gray-50">
                            <h4 className="text-center font-bold text-gray-600 mb-4"><i className="fa-solid fa-hand-pointer mr-2"></i> Chạm để chọn và di chuyển thẻ</h4>
                            <div className="flex flex-wrap gap-3 justify-center">
                                {blocks.map((block, i) => block && (
                                    <div 
                                        key={block.id}
                                        onClick={() => handleBlockClick(block.id, 'pool', i)}
                                        className={`drag-item p-3 px-5 bg-white border-2 border-gray-300 rounded-xl shadow-sm font-mono text-lg font-bold text-gray-700 hover:border-purple-400 ${selectedId && selectedId.type === 'pool' && selectedId.index === i ? 'selected-drag' : ''} ${isCorrect ? 'opacity-50 pointer-events-none' : ''}`}
                                    >
                                        {block.text}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // CHẶNG 4: Toán quanh em (Hỗn hợp)
        const Stage4 = ({ onComplete }) => {
            const [currentBài, setCurrentBài] = useState(0);
            const bài = stage4Data[currentBài];
            
            // State for drags
            const [pool, setPool] = useState([]);
            const [slots, setSlots] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            
            // State for inputs
            const [inputs, setInputs] = useState({});
            
            const [modal, setModal] = useState({open:false});
            const [isDone, setIsDone] = useState(false);

            useEffect(() => {
                const shuffled = [...bài.drags].sort(() => Math.random() - 0.5);
                setPool(shuffled.map((t, i) => ({ id: `p_${i}`, text: t })));
                setSlots(Array(bài.steps.length).fill(null));
                setInputs({});
                setSelectedId(null);
                setIsDone(false);
            }, [currentBài]);

            const handleBlockClick = (id, fromType, idx) => {
                if (isDone) return;
                if (!selectedId) {
                    setSelectedId({ id, type: fromType, index: idx });
                } else {
                    const newPool = [...pool];
                    const newSlots = [...slots];
                    const src = selectedId;
                    const dest = { id, type: fromType, index: idx };

                    let srcItem = src.type === 'pool' ? newPool[src.index] : newSlots[src.index];
                    let destItem = dest.type === 'pool' ? newPool[dest.index] : newSlots[dest.index];

                    if (src.type === 'pool') newPool[src.index] = destItem;
                    else newSlots[src.index] = destItem;

                    if (dest.type === 'pool') newPool[dest.index] = srcItem;
                    else newSlots[dest.index] = srcItem;

                    setPool(newPool);
                    setSlots(newSlots);
                    setSelectedId(null);
                }
            };

            const checkAll = () => {
                let allCorrect = true;
                let errorMsg = '';

                bài.steps.forEach((step, i) => {
                    const slotItem = slots[i];
                    const inputVal = inputs[i] ? inputs[i].replace(/\s/g, '') : '';
                    
                    if (!slotItem || slotItem.text.replace(/\s/g, '') !== step.dragAns.replace(/\s/g, '')) {
                        allCorrect = false;
                        errorMsg = 'Có biểu thức chưa đúng vị trí. Hãy xem lại các phép tính.';
                    }
                    if (inputVal !== step.inputAns) {
                        allCorrect = false;
                        errorMsg = 'Có kết quả tính toán chưa chính xác.';
                    }
                });

                if (allCorrect) {
                    setIsDone(true);
                    setModal({open:true, title:'Xuất sắc!', content:'Em đã giải đúng hoàn toàn bài toán thực tế này!', type:'success'});
                } else {
                    setModal({open:true, title:'Cần cố gắng', content: errorMsg + ' Đọc kỹ lại gợi ý nhé.', type:'error'});
                }
            };

            return (
                <div className="max-w-5xl mx-auto">
                    <Modal isOpen={modal.open} onClose={() => setModal({...modal, open: false})} title={modal.title} content={modal.content} type={modal.type} />
                    
                    <div className="flex justify-between mb-4">
                        <h2 className="text-2xl font-bold text-orange-700">Chặng 4: {bài.name}</h2>
                        <div className="text-gray-500 font-bold">{currentBài + 1} / {stage4Data.length}</div>
                    </div>

                    <div className="card-25d p-6 bg-yellow-50 border-yellow-200 mb-6 text-lg text-gray-800 leading-relaxed font-semibold">
                        <i className="fa-solid fa-book-open text-orange-500 mr-2"></i> {bài.context}
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        {/* Pool */}
                        <div className="md:col-span-1 card-25d p-4 bg-white border-2 border-dashed border-gray-300">
                            <h4 className="text-center font-bold text-gray-500 mb-4">Kho phép tính</h4>
                            <div className="flex flex-col gap-3">
                                {pool.map((block, i) => block && (
                                    <div 
                                        key={block.id}
                                        onClick={() => handleBlockClick(block.id, 'pool', i)}
                                        className={`p-3 bg-blue-50 border-2 border-blue-200 rounded-xl text-center font-mono font-bold cursor-pointer hover:bg-blue-100 ${selectedId && selectedId.type === 'pool' && selectedId.index === i ? 'selected-drag' : ''}`}
                                    >
                                        {block.text}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Steps */}
                        <div className="md:col-span-2 card-25d p-6 bg-white">
                            <div className="space-y-6">
                                {bài.steps.map((step, i) => (
                                    <div key={i} className="flex flex-col md:flex-row items-center gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                        <div className="font-bold text-gray-700 md:w-1/3">{step.label}</div>
                                        <div className="flex items-center gap-2 w-full md:w-2/3">
                                            <div 
                                                onClick={() => handleBlockClick(slots[i] ? slots[i].id : null, 'slot', i)}
                                                className={`flex-1 slot min-h-[40px] px-2 ${slots[i] ? 'filled' : ''} ${isDone ? 'correct border-green-500 bg-green-50' : ''} ${selectedId && selectedId.type === 'slot' && selectedId.index === i ? 'selected-drag' : ''}`}
                                            >
                                                {slots[i] ? <span className="font-mono font-bold text-blue-800">{slots[i].text}</span> : <span className="text-sm text-gray-400">Chọn phép tính</span>}
                                            </div>
                                            <span className="font-bold text-gray-500">=</span>
                                            <input 
                                                type="text" 
                                                value={inputs[i] || ''}
                                                onChange={(e) => setInputs({...inputs, [i]: e.target.value})}
                                                disabled={isDone}
                                                className={`math-input w-24 px-2 py-2 text-lg ${isDone ? 'correct' : ''}`}
                                                placeholder="Kết quả"
                                            />
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="mt-8 flex justify-center gap-4">
                                <button onClick={() => setModal({open:true, title:'Gợi ý', content: bài.hints.join(' \n'), type:'info'})} className="btn-3d btn-yellow px-6 py-3 rounded-full font-bold">Gợi ý</button>
                                {!isDone ? (
                                    <button onClick={checkAll} className="btn-3d btn-blue px-8 py-3 rounded-full font-bold text-xl">Nộp Bài</button>
                                ) : (
                                    <button onClick={() => { if(currentBài < stage4Data.length-1) setCurrentBài(c=>c+1); else onComplete(); }} className="btn-3d btn-green px-8 py-3 rounded-full font-bold text-xl">Hoàn Thành <i className="fa-solid fa-flag-checkered ml-2"></i></button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };


        // TỔNG HỢP GIAO DIỆN
        const App = () => {
            const [view, setView] = useState('home'); // home, s1, s2, s3, s4, teacher
            const [studentName, setStudentName] = useState('');
            const [studentClass, setStudentClass] = useState('');
            const [tempName, setTempName] = useState('');
            const [tempClass, setTempClass] = useState('');
            const [progress, setProgress] = useState({ s1: false, s2: false, s3: false, s4: false });

            useEffect(() => {
                const saved = localStorage.getItem('toan6_progress');
                if (saved) setProgress(JSON.parse(saved));
            }, []);

            const updateProgress = (stage) => {
                const newP = {...progress, [stage]: true};
                setProgress(newP);
                localStorage.setItem('toan6_progress', JSON.stringify(newP));
                setView('home');
            };

            const startApp = () => {
                if (!tempName.trim() || !tempClass.trim()) {
                    alert('Em hãy nhập đầy đủ Tên và Lớp trước khi bắt đầu nhé!');
                    return;
                }
                setStudentName(tempName.trim());
                setStudentClass(tempClass.trim().toUpperCase());
            };

            if (view === 'teacher') {
                return (
                    <div className="min-h-screen p-8 bg-gray-100">
                        <div className="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl">
                            <h1 className="text-3xl font-bold text-red-600 mb-6"><i className="fa-solid fa-chalkboard-user"></i> Bảng điều khiển Giáo viên</h1>
                            <div className="p-4 bg-gray-50 rounded-xl border mb-6">
                                <p>Tính năng lưu trữ offline qua LocalStorage. Dữ liệu trên máy này:</p>
                                <pre className="bg-black text-green-400 p-4 rounded mt-2 overflow-auto">
                                    {localStorage.getItem('toan6_progress') || 'Chưa có dữ liệu'}
                                </pre>
                            </div>
                            <button onClick={() => {localStorage.removeItem('toan6_progress'); setProgress({ s1: false, s2: false, s3: false, s4: false });}} className="btn-3d btn-red bg-red-500 text-white px-4 py-2 rounded">Xóa Dữ Liệu</button>
                            <button onClick={() => setView('home')} className="btn-3d btn-gray ml-4 px-4 py-2 rounded">Quay lại Home</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-12">
                    {/* Header */}
                    <header className="bg-white shadow-sm py-4 px-6 mb-8 flex justify-between items-center border-b-4 border-blue-400 sticky top-0 z-10">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
                            <div className="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center text-white text-2xl font-black shadow-[0_4px_0_0_#1d4ed8]">T6</div>
                            <h1 className="text-xl md:text-2xl font-black text-blue-900 hidden md:block">CHINH PHỤC TOÁN 6</h1>
                        </div>
                        {studentName && <div className="font-bold text-gray-600 bg-gray-100 px-4 py-2 rounded-full shadow-inner border"><i className="fa-solid fa-user-astronaut text-blue-500 mr-1"></i> {studentName} - {studentClass}</div>}
                    </header>

                    <main className="container mx-auto px-4">
                        {view === 'home' && (
                            <div className="max-w-3xl mx-auto animate-fade-in">
                                <div className="text-center mb-10">
                                    <h2 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-4 drop-shadow-sm">ÔN TẬP GIỮA HỌC KÌ I</h2>
                                    <p className="text-xl text-gray-600 font-semibold">Năm học 2026 - 2027</p>
                                </div>

                                {!studentName ? (
                                    <div className="card-25d p-8 text-center max-w-md mx-auto">
                                        <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Felix" alt="Avatar" className="w-24 h-24 mx-auto mb-4 bg-yellow-100 rounded-full" />
                                        <h3 className="text-2xl font-bold mb-4">Chào mừng chiến binh mới!</h3>
                                        <input 
                                            type="text" 
                                            placeholder="Nhập họ và tên..." 
                                            value={tempName}
                                            onChange={(e) => setTempName(e.target.value)}
                                            className="w-full p-4 text-xl border-2 border-blue-200 rounded-xl mb-4 text-center focus:border-blue-500 outline-none transition-all"
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="Nhập lớp (VD: 6A1)..." 
                                            value={tempClass}
                                            onChange={(e) => setTempClass(e.target.value)}
                                            className="w-full p-4 text-xl border-2 border-blue-200 rounded-xl mb-6 text-center focus:border-blue-500 outline-none transition-all uppercase"
                                            onKeyDown={(e) => e.key === 'Enter' && startApp()}
                                        />
                                        <button onClick={startApp} className="btn-3d btn-blue w-full py-4 rounded-xl font-bold text-xl">BẮT ĐẦU <i className="fa-solid fa-rocket ml-2"></i></button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {[
                                            { id: 's1', title: 'Khởi Động Trí Tuệ', sub: '25 Câu Trắc Nghiệm', icon: 'fa-brain', color: 'blue', done: progress.s1 },
                                            { id: 's2', title: 'Bậc Thầy Tính Toán', sub: '8 Bài Thực Hiện Phép Tính', icon: 'fa-calculator', color: 'green', done: progress.s2 },
                                            { id: 's3', title: 'Giải Mã Ẩn Số X', sub: '4 Bài Tìm X', icon: 'fa-magnifying-glass-chart', color: 'purple', done: progress.s3 },
                                            { id: 's4', title: 'Toán Học Quanh Em', sub: '4 Bài Toán Thực Tế', icon: 'fa-earth-asia', color: 'orange', done: progress.s4 }
                                        ].map((card) => (
                                            <div 
                                                key={card.id} 
                                                onClick={() => setView(card.id)}
                                                className={`card-25d p-6 cursor-pointer transform transition hover:-translate-y-2 flex items-center gap-4 ${card.done ? 'bg-gray-50 border-green-300' : 'bg-white hover:border-'+card.color+'-400'}`}
                                            >
                                                <div className={`w-16 h-16 rounded-2xl flex items-center justify-center text-white text-3xl shadow-inner ${card.done ? 'bg-green-500' : `bg-${card.color}-500`}`}>
                                                    <i className={`fa-solid ${card.done ? 'fa-check' : card.icon}`}></i>
                                                </div>
                                                <div>
                                                    <h3 className="text-xl font-bold text-gray-800">{card.title}</h3>
                                                    <p className="text-gray-500">{card.sub}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                {/* Nút ẩn dành cho giáo viên */}
                                <div className="text-center mt-12">
                                    <button onDoubleClick={() => setView('teacher')} className="text-gray-300 hover:text-gray-400 text-sm"><i className="fa-solid fa-lock"></i> Giáo viên</button>
                                </div>
                            </div>
                        )}

                        {view === 's1' && <Stage1 onComplete={() => updateProgress('s1')} studentName={studentName} studentClass={studentClass} />}
                        {view === 's2' && <Stage2 onComplete={() => updateProgress('s2')} />}
                        {view === 's3' && <Stage3 onComplete={() => updateProgress('s3')} />}
                        {view === 's4' && <Stage4 onComplete={() => updateProgress('s4')} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
